<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Placeholder preview image">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED" />
      <stop offset="1" stop-color="#5B21B6" />
    </linearGradient>
  </defs>
  <!-- Opaque background on purpose: a tile preview sits on a surface that flips with the
       theme, so a transparent single-colour asset disappears in one of them. -->
  <rect width="800" height="450" fill="url(#bg)" />
  <g fill="#ffffff" opacity="0.92">
    <rect x="64" y="80" width="220" height="20" rx="10" />
    <rect x="64" y="124" width="420" height="14" rx="7" opacity="0.7" />
    <rect x="64" y="156" width="360" height="14" rx="7" opacity="0.7" />
  </g>
  <g fill="#ffffff" opacity="0.18">
    <rect x="64" y="216" width="320" height="170" rx="12" />
    <rect x="416" y="216" width="320" height="170" rx="12" />
  </g>
  <text x="400" y="424" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#ffffff" opacity="0.8">
    Replace with a screenshot of your product
  </text>
</svg>
