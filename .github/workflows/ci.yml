# CI for the public papervine/papervine mirror. Generated by scripts/mirror-cli.mjs in the
# upstream monorepo — edit it there, not here.
#
# Deliberately runs without any services, so a contributor's PR gets real signal without
# a Postgres/MinIO setup: typecheck, the renderer's pure unit tests, and the clean-room
# package test (which packs the real tarball, installs it outside the tree, and serves
# examples/starter through it).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `legacy-peer-deps` is set in .npmrc — one of the MDX dependencies declares an
      # impossible peer range. Keep it.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      # The one that matters: everything above runs with the workspace's node_modules in
      # scope, so only this can catch a break that exists solely in the published package
      # — an undeclared dependency, or a file the packaging step dropped.
      - name: Clean-room package test
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run test:cli
