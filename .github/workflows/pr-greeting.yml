# Tells first-time contributors how PRs land here, on open — before they wonder why
# nobody pressed Merge. Generated by scripts/mirror-cli.mjs upstream; edit it there.
#
# `pull_request_target` so the token can comment on PRs from forks. It checks out nothing
# and runs no PR code, which is what makes that safe.
name: PR greeting

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                "Thanks for the PR! One thing worth knowing up front, since it looks unusual:",
                "",
                "**This PR will be reviewed here, but merged upstream.** Papervine is developed in a",
                "private monorepo (the renderer is shared with a hosted product), and this repository is a",
                "generated mirror of the open-source half. Nobody clicks Merge here — a merge would be",
                "reverted by the next sync. Instead we apply accepted changes upstream, and the next sync",
                "brings them back here.",
                "",
                "**Your authorship is preserved.** The commit that lands keeps you as the author, so it's",
                "credited to you and counts toward your contribution graph. We'll link it when we close",
                "this PR.",
                "",
                "See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) for the details, and thanks again.",
              ].join("\n"),
            })
