# Publishes `papervine` to npm with provenance. Generated by scripts/mirror-cli.mjs in the
# upstream monorepo — edit it there, not here.
#
# This lives in the public repo rather than the monorepo on purpose. npm validates that a
# package's `repository` field matches the repository the workflow runs in ("Ensure your
# package.json is configured with a public repository that matches (case-sensitive) where
# you are publishing with provenance from"), and `apps/cli/package.json` points here. A
# publish from the monorepo would be rejected on that mismatch. It's also the right home
# for a different reason: provenance exists so a reader can check the tarball against its
# source, which only means something when the attestation points at a repo they can open.
#
# Dormant until you deliberately trigger it: push a version tag (e.g. `v0.1.0`) or run it
# from the Actions tab. Requires an `NPM_TOKEN` secret (an npm automation token with
# publish rights) on THIS repository.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for `npm publish --provenance`
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # Same gates as CI, so a tag can never ship a broken package. `test:cli` is the
      # important one — it packs the real tarball, installs it outside the tree, and
      # serves a docs site through it.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Clean-room package test
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run test:cli

      # `--access public` is required alongside `--provenance`: npm refuses to attest a
      # package it considers private. Publishing runs the CLI's `prepack`, which builds
      # the renderer that gets packed.
      - name: Publish papervine
        run: npm publish --workspace papervine --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
